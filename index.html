<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- viewport: faz o site se ajustar à largura da tela do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rick and Morty - Catálogo de personagens</title>
  <!-- ícone da aba do navegador (um emoji dentro de um SVG, não precisa de arquivo) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B8%3C/text%3E%3C/svg%3E">
  <!-- Fontes do Google Fonts (se não carregarem, o navegador usa uma fonte padrão) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Nosso CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO: título, controles (busca, filtro, favoritos) e o portal -->
  <header class="hero">
    <div class="hero-texto">
      <h1>Rick and Morty</h1>
      <p class="sub">Catálogo de personagens de todas as dimensões, carregado ao vivo da Rick and Morty API.</p>

      <div class="controles">
        <input type="search" id="busca" placeholder="Buscar personagem (ex: Summer)" aria-label="Buscar personagem pelo nome">
        <select id="filtro-status" aria-label="Filtrar por status">
          <option value="">Qualquer status</option>
          <option value="alive">Vivo</option>
          <option value="dead">Morto</option>
          <option value="unknown">Desconhecido</option>
        </select>
        <button id="btn-favoritos" type="button">&hearts; Favoritos (<span id="qtd-fav">0</span>)</button>
      </div>
    </div>

    <!-- Portal: ao clicar, o JavaScript sorteia uma página aleatória de personagens -->
    <button class="portal" id="btn-portal" type="button" aria-label="Abrir um portal e ver uma página aleatória">
      <span>Abrir portal</span>
    </button>
  </header>

  <!-- CONTEÚDO PRINCIPAL
       A section "lista-cards" começa VAZIA de propósito: os cards são criados
       pelo JavaScript com os dados da API (requisito do trabalho). -->
  <main id="galeria">
    <p id="mensagem" class="mensagem" role="status"></p>
    <section id="lista-cards" class="cards"></section>

    <div class="paginacao">
      <button id="anterior" type="button">&laquo; Anterior</button>
      <span id="pagina-info"></span>
      <button id="proxima" type="button">Próxima &raquo;</button>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>Dados da <a href="https://rickandmortyapi.com/" target="_blank" rel="noopener">Rick and Morty API</a>. Projeto de Web Development Front-End, UniFECAF.</p>
  </footer>

  <!-- JAVASCRIPT: fica no fim do body para o HTML carregar antes. -->
  <script src="script.js"></script>
</body>
</html>
